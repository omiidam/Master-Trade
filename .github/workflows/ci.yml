name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22.5+ is required for `node:sqlite` (the local database driver, ADR-0025).
        # The 24 lane exercises the database suites; on a 22 build without the
        # built-in enabled they skip with a recorded reason instead of failing.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` installs exactly the committed lockfile and fails on drift, so a
      # dependency cannot change under CI without the lockfile changing with it.
      - run: npm ci
      # Ship-time dependencies only, and only high or critical. The open advisories
      # in the dev/test toolchain (vitest 2's nested vite 5 / esbuild, @vitest/mocker)
      # are deliberately out of scope here and are recorded with their reachability in
      # docs/dependency-audit.md. A production-scope advisory is not acceptable.
      - run: npm run audit:prod
      - run: npm run validate
