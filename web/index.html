<!doctype html>
<html lang="en" dir="ltr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#111212" />
    <meta name="application-name" content="Master Trade" />
    <meta
      name="description"
      content="Master Trade — trading intelligence workstation. Structured analysis over declared data; live trading and broker execution are disabled by design."
    />

    <!--
      Browser identity. Every file named here is generated from one approved source by
      `scripts/build-brand-assets.mjs`; nothing is hand-exported, and
      `tests/brand.test.ts` fails if a referenced file stops existing. The compact mark is
      used here because these surfaces are 16–192 px, where the full lockup's wordmark is
      unreadable. /og-image.png is the one place with room for the whole thing.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/favicon-16.png" sizes="16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Master Trade" />
    <meta property="og:title" content="Master Trade — trading intelligence workstation" />
    <meta
      property="og:description"
      content="Structured trading analysis, portfolio intelligence and decision evaluation over declared data. Live trading and broker execution are disabled by design."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Master Trade — mark, wordmark and tagline." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/og-image.png" />

    <title>Master Trade — Workstation Preview</title>
    <style>
      /*
        First paint. This is static markup inside #root, which React replaces the moment it
        mounts: there is no script here, because the shell's content security policy allows
        no inline scripts, and a splash that needed one could not run in the desktop build.
        It exists so the window never flashes an empty frame, and so the first thing on
        screen is the product's own name rather than a blank rectangle.

        **Phase 9: the palette left this block, and deliberately so.**

        Until now this block declared four hexes and called them "a necessary second home for the
        palette". That was true when there was one theme and it is false now: a hardcoded background
        here cannot know which of two themes the reader chose, so a light-theme reader was served a
        dark first frame over a light page — and because unlayered author CSS beats any `@layer`,
        it kept winning *after* the stylesheet loaded too. The measurement that found it: with
        `data-theme="light"` on the document, `body`'s computed background was still #111212.

        The splash no longer needs to paint a background at all. `global.css` is imported by
        `main.tsx`, which means it is in the document before the first paint, and
        `applyDocumentTheme` runs before React renders — so the theme is already correct by the
        time a pixel is drawn, from one source. What remains here is layout for the splash alone:
        no colour, no palette, nothing that a theme could contradict.
      */
      html,
      body {
        margin: 0;
      }
      #brand-boot {
        display: flex;
        min-height: 100vh;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font:
          400 14px/1.5 ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
      }
      #brand-boot img {
        width: 72px;
        height: 72px;
        border-radius: 12px;
        border: 1px solid currentColor;
      }
      #brand-boot p {
        margin: 0;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      #brand-boot span {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="brand-boot">
        <img src="/icon-192.png" width="72" height="72" alt="" />
        <p>Master Trade</p>
        <span>Starting the workstation…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
